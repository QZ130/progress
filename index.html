<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="progress">
<meta name="theme-color" content="#FDF3F4">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>progress · 个人工作台</title>
<style>
  :root {
    --page: #FDF3F4;
    --surface: #FFFFFF;
    --surface-2: #FFF9F9;
    --ink: #263554;
    --on-invert: #FFFFFF;
    --invert: #263554;
    --invert-active: #33466E;
    --text-2: #6E7A96;
    --text-3: #9AA3BC;
    --text-faint: #C4CBDC;
    --line: #F1E7E9;
    --line-strong: #E3D6D9;
    --track: #F4EAEC;
    --subtle: #FBEFF1;
    --ring: #263554;
    --sel-bg: #FDE7E7;
    --sel-color: #263554;
    --overlay: rgba(38, 53, 84, 0.45);
    --shadow: rgba(38, 53, 84, 0.08);
    color-scheme: light;
  }
  [data-theme="dark"] {
    --page: #131A2E;
    --surface: #1E2745;
    --surface-2: #222C4C;
    --ink: #EDF0F7;
    --on-invert: #FFFFFF;
    --invert: #EDF0F7;
    --invert-active: #C9D2E8;
    --text-2: #A9B3CE;
    --text-3: #7C88A8;
    --text-faint: #55618A;
    --line: #2C3760;
    --line-strong: #3D4A74;
    --track: #2A3557;
    --subtle: #29345A;
    --ring: #EDF0F7;
    --sel-bg: #33406B;
    --sel-color: #EDF0F7;
    --overlay: rgba(0, 0, 0, 0.6);
    --shadow: rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
  html.theme-anim * { transition: background-color .2s ease, color .2s ease, border-color .2s ease !important; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: hidden; }
  body {
    background: var(--page);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    display: flex; justify-content: center; padding: 0;
  }
  .phone {
    width: 100%; max-width: 400px; background: var(--surface);
    height: 100vh; display: flex; flex-direction: column;
    overflow: hidden;
  }
  .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px 12px; border-bottom: 1px solid var(--line); background: var(--surface);
  }
  .nav-title { font-size: 17px; font-weight: 700; color: var(--ink); }
  .nav-btn { font-size: 14px; color: var(--text-2); cursor: pointer; background: none; border: none; padding: 4px 0; }
  .nav-btn.primary { font-weight: 700; color: var(--ink); }
  .nav-btn:disabled { color: var(--text-faint); }
  .content { flex: 1; overflow-y: auto; padding: 16px 18px 20px; }
  .sub { font-size: 12px; color: var(--text-2); margin-bottom: 12px; }
  .card {
    border: 1px solid var(--line-strong); border-radius: 14px; padding: 12px;
    margin-bottom: 10px; cursor: pointer; background: var(--surface);
    box-shadow: 0 2px 10px var(--shadow);
    transition: background 0.12s;
  }
  .card:active { background: var(--subtle); }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; }
  .card-name { font-size: 14px; font-weight: 700; color: var(--ink); }
  .card-pct { font-size: 14px; font-weight: 700; color: var(--ink); }
  .card-dates { font-size: 11px; color: var(--text-3); margin: 3px 0 8px; }
  .bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; margin-bottom: 7px; }
  .bar-fill { height: 100%; background: var(--invert); border-radius: 3px; }
  .card-detail { font-size: 12px; color: var(--text-2); }
  .btn-dashed {
    border: 1px dashed var(--text-3); border-radius: 12px; padding: 12px;
    text-align: center; font-size: 14px; color: var(--text-2); cursor: pointer; background: var(--surface);
  }
  .btn-dashed:active { background: var(--subtle); }
  .link-row { text-align: center; padding: 14px 0 0; font-size: 13px; color: var(--text-2); cursor: pointer; }
  .btn-primary {
    background: var(--invert); color: var(--on-invert); border: none; border-radius: 12px;
    padding: 13px; text-align: center; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%;
  }
  .btn-primary:active { background: var(--invert-active); }
  .btn-outline {
    background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 12px;
    padding: 13px; text-align: center; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%;
  }
  .btn-outline:active { background: var(--subtle); }
  .btn-danger {
    background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 12px;
    padding: 10px; text-align: center; font-size: 13px; cursor: pointer; width: 100%;
  }
  .btn-danger:active { background: var(--subtle); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: var(--text-2); margin-bottom: 5px; }
  .input {
    width: 100%; border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px;
    font-size: 16px; color: var(--ink); background: var(--surface); font-family: inherit;
  }
  .input::placeholder { color: var(--text-faint); }
  .input:focus { outline: none; border-width: 2px; border-color: var(--ink); }
  .err { color: var(--ink); font-size: 11px; margin-top: 4px; }
  .tabbar {
    display: flex; border-top: 1px solid var(--line-strong); background: var(--surface);
    flex-shrink: 0;
  }
  .tab {
    flex: 1; text-align: center; padding: 13px 2px 15px; font-size: 14px; font-weight: 700;
    color: var(--text-3); cursor: pointer; background: var(--surface); border: none;
  }
  .tab.active { color: var(--ink); font-weight: 700; }
  .sel-circle { width: 22px; height: 22px; border: 2px solid var(--line-strong); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--surface); }
  .sel-circle.on { background: var(--invert); }
  .sel-circle.on::after { content: ''; width: 8px; height: 8px; background: var(--on-invert); border-radius: 50%; }
  .card.selected { background: var(--subtle); }
  .selbar { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line-strong); background: var(--surface); padding: 10px 14px; flex-shrink: 0; }
  .selbar .count { flex: 1; font-size: 13px; color: var(--text-2); text-align: center; }
  .selbar button { flex: 1; }
  .big-bar { height: 12px; background: var(--track); border-radius: 6px; overflow: hidden; margin: 8px 0 6px; }
  .kv { font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
  .kv b { font-size: 18px; color: var(--ink); }
  .rec-row {
    display: flex; justify-content: space-between; padding: 9px 0;
    border-bottom: 1px solid var(--line); font-size: 13px; color: var(--text-2);
  }
  .rec-note { color: var(--text-3); }
  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 6px; }
  .tag.done { background: var(--invert); color: var(--on-invert); }
  .tag.expired { border: 1px solid var(--line-strong); color: var(--ink); }
  .empty { text-align: center; color: var(--text-3); font-size: 13px; padding: 40px 0; }
  .modal-overlay {
    position: fixed; inset: 0; background: var(--overlay);
    display: flex; align-items: center; justify-content: center; z-index: 20; padding: 20px;
  }
  .modal-box {
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: 16px;
    width: 100%; max-width: 340px; padding: 18px; box-shadow: 0 10px 30px var(--shadow);
  }
  .modal-title { font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 12px; text-align: center; }
  .modal-actions { display: flex; gap: 10px; margin-top: 14px; }
  .modal-actions button { flex: 1; }
  .tabpage { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-3); font-size: 14px; flex-direction: column; }
  .tabpage .big { font-size: 40px; margin-bottom: 10px; }

  /* ===== 客户管理 ===== */
  .searchbar { display: flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 12px; padding: 9px 12px; margin-bottom: 10px; background: var(--surface); box-shadow: 0 2px 8px var(--shadow); }
  .searchbar input { flex: 1; border: none; outline: none; font-size: 13px; font-family: inherit; background: transparent; color: var(--ink); }
  .searchbar input::placeholder { color: var(--text-faint); }
  .toolbar { display: flex; gap: 6px; margin-bottom: 12px; }
  .tool-btn { flex: 1; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); color: var(--ink); font-size: 12px; font-weight: 600; padding: 8px 0; cursor: pointer; }
  .tool-btn:active { background: var(--subtle); }
  .tool-btn.on { background: var(--sel-bg); color: var(--sel-color); border-color: var(--ring); }
  .group-label { font-size: 12px; font-weight: 700; color: var(--text-2); margin: 14px 0 8px; padding-left: 2px; }
  .cust-row { border: 1px solid var(--line-strong); border-radius: 14px; padding: 11px 12px; margin-bottom: 8px; background: var(--surface); cursor: pointer; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 8px var(--shadow); }
  .cust-row:active { background: var(--subtle); }
  .cust-main { flex: 1; min-width: 0; }
  .cust-name { font-size: 14px; font-weight: 700; color: var(--ink); }
  .cust-title { font-size: 11px; color: var(--text-3); font-weight: 400; margin-left: 6px; }
  .cust-unit { font-size: 11px; color: var(--text-2); margin-top: 2px; }
  .cust-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
  .tagchip { font-size: 10px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 1px 8px; color: var(--ink); background: var(--surface); }
  .tagchip.solid { background: var(--invert); color: var(--on-invert); }
  .color-picker { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .color-dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--surface); outline: 1px solid var(--line); cursor: pointer; }
  .color-dot.on { outline: 2px solid var(--ring); }
  .plus-btn { width: 34px; height: 34px; border: 2px solid var(--line-strong); border-radius: 50%; background: var(--surface); color: var(--ink); font-size: 18px; font-weight: 700; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .plus-btn:active { background: var(--invert); color: var(--on-invert); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 3px; font-size: 10px; color: var(--text-3); text-align: center; }
  .cal-day { border: 1px solid var(--line); border-radius: 8px; min-height: 44px; padding: 3px; font-size: 10px; color: var(--text-2); cursor: pointer; background: var(--surface); position: relative; text-align: center; }
  .cal-day.other { color: var(--text-faint); background: var(--surface-2); }
  .cal-day.holiday { background: var(--subtle); }
  .cal-day.selected { background: var(--sel-bg); color: var(--sel-color); border-color: var(--ring); }
  .cal-day .d { font-weight: 700; }
  .cal-day .holi { font-size: 7px; color: var(--ink); font-weight: 600; }
  .cal-day.selected .holi, .cal-day.selected .cc-dot { color: var(--sel-color); }
  .slot-tag { display: inline-block; font-size: 8px; border-radius: 3px; padding: 0 3px; margin-top: 1px; font-weight: 700; }
  .slot-am { background: var(--invert); color: var(--on-invert); }
  .slot-pm { background: var(--surface); border: 1px solid var(--line-strong); color: var(--ink); }
  .slot-night { background: #6E7A96; color: #fff; }
  .note-item { border-bottom: 1px solid var(--line); padding: 9px 0; font-size: 12px; color: var(--text-2); }
  .note-item img { max-width: 100%; max-height: 140px; border: 1px solid var(--line); border-radius: 6px; margin-top: 6px; display: block; }
  .note-date { font-size: 10px; color: var(--text-3); margin-bottom: 2px; }
  .filter-panel { border: 1px solid var(--line-strong); border-radius: 14px; padding: 12px; margin-bottom: 12px; background: var(--surface); box-shadow: 0 2px 8px var(--shadow); }
  .filter-title { font-size: 12px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
  .filter-group { margin-bottom: 10px; }
  .filter-group .label { font-size: 11px; color: var(--text-2); margin-bottom: 5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 11px; border: 1px solid var(--line-strong); border-radius: 16px; padding: 4px 10px; color: var(--ink); background: var(--surface); cursor: pointer; }
  .chip.on { background: var(--sel-bg); color: var(--sel-color); border-color: var(--ring); }
  .visit-group-date { font-size: 12px; font-weight: 700; color: var(--ink); margin: 12px 0 6px; }
  .visit-item { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line-strong); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; background: var(--surface); box-shadow: 0 2px 8px var(--shadow); }
  .slot-badge { font-size: 10px; font-weight: 700; border: 1px solid var(--line-strong); border-radius: 6px; padding: 1px 6px; color: var(--ink); background: var(--surface); }
  .img-thumb { width: 46px; height: 46px; border: 1px solid var(--line); border-radius: 10px; object-fit: cover; }

  .coord-tip { font-size: 11px; color: var(--text-3); margin-top: 6px; }
  /* ===== 日历版块 / 拜访完成 / 标签排序 ===== */
  .cal-strip { flex: 1; display: flex; gap: 4px; overflow-x: auto; }
  .cal-cell { flex: 1; min-width: 34px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 2px; text-align: center; cursor: pointer; background: var(--surface); }
  .cal-cell.today { border-color: var(--ring); border-width: 2px; }
  .cal-cell.sel { background: var(--sel-bg); color: var(--sel-color); border-color: var(--ring); }
  .cal-cell .cc-week { font-size: 10px; color: var(--text-3); }
  .cal-cell .cc-day { font-size: 14px; font-weight: 700; }
  .cal-cell.sel .cc-week { color: var(--sel-color); }
  .cal-cell.sel .cc-holi, .cal-cell.sel .cc-dot { color: var(--sel-color); }
  .cal-cell .cc-holi { font-size: 7px; color: var(--ink); }
  .cal-cell .cc-dot { font-size: 7px; color: var(--ink); }
  .visit-item.done { opacity: 0.45; }
  .done-check { width: 22px; height: 22px; border: 1px solid var(--line-strong); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; cursor: pointer; flex-shrink: 0; }
  .done-check.on { background: var(--sel-bg); color: var(--sel-color); border-color: var(--ring); }
  .tag-row { cursor: grab; touch-action: none; }
  .tag-row.dragging { background: var(--subtle); opacity: 0.6; cursor: grabbing; }

  /* ===== 左侧栏布局 ===== */
  .layout { display: flex; flex: 1; min-height: 0; }
  .sidebar { width: 20%; min-width: 56px; border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; flex-shrink: 0; }
  .side-brand { display: flex; align-items: center; justify-content: center; gap: 5px; padding: 16px 4px 12px; border-bottom: 1px solid var(--line); }
  .brand-dot { width: 14px; height: 14px; background: var(--invert); border-radius: 4px; }
  .brand-text { font-size: 13px; font-weight: 800; color: var(--ink); letter-spacing: 0.5px; }
  .side-nav { padding: 12px 8px; display: flex; flex-direction: column; gap: 4px; }
  .side-item { padding: 11px 4px; text-align: center; cursor: pointer; font-size: 12px; color: var(--text-2); border-radius: 10px; transition: background 0.12s, transform 0.08s; }
  .side-item:hover { background: var(--subtle); }
  .side-item:active { transform: scale(0.97); }
  .side-item.active { background: var(--invert); color: var(--on-invert); box-shadow: 0 2px 8px var(--shadow); }
  .side-footer { margin-top: auto; padding: 12px 8px; border-top: 1px solid var(--line); }
  .theme-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 4px; padding: 9px 4px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); color: var(--ink); font-size: 12px; font-weight: 600; cursor: pointer; }
  .theme-btn:active { background: var(--subtle); }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  @media (min-width: 768px) {
    .sidebar { width: 140px; }
    .side-brand { justify-content: flex-start; padding: 20px 18px 14px; }
    .side-nav { padding: 14px 12px; gap: 6px; }
    .side-item { font-size: 13px; text-align: left; padding: 12px 14px; }
    .side-footer { padding: 14px 12px; }
  }
  /* ===== 首页概览 ===== */
  .home-greet { font-size: 20px; font-weight: 800; color: var(--ink); }
  .home-sub { font-size: 12px; color: var(--text-2); margin: 2px 0 14px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .stat-card { border-radius: 16px; padding: 14px 12px; box-shadow: 0 2px 10px var(--shadow); cursor: pointer; }
  .stat-card .sc-num { font-size: 26px; font-weight: 800; line-height: 1.1; }
  .stat-card .sc-label { font-size: 11px; margin-top: 2px; opacity: 0.85; }
  .stat-pink { background: #FDE7E7; color: #263554; }
  .stat-blue { background: #E3ECF8; color: #263554; }
  .stat-mint { background: #E4F2EF; color: #263554; }
  .stat-lav { background: #ECE8F6; color: #263554; }
  /* ===== 地图选地址（淘宝式） ===== */
  .addrpick-overlay { padding: 0; z-index: 30; }
  .addrpick-box { position: fixed; inset: 0; background: var(--surface); display: flex; flex-direction: column; }
  .addrpick-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 10px; font-size: 15px; font-weight: 700; color: var(--ink); border-bottom: 1px solid var(--line); }
  .addrpick-head .close { font-size: 14px; color: var(--text-2); cursor: pointer; padding: 2px 6px; }
  .addrpick-search { display: flex; gap: 6px; padding: 10px 14px; }
  .addrpick-search .input { flex: 1; }
  .addrpick-search .locate { flex: 0 0 auto; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 0 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .addrpick-map { height: 300px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .addrpick-list { flex: 1; overflow-y: auto; padding: 8px 14px 12px; }
  .ap-item { padding: 10px 6px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .ap-item.on { background: var(--sel-bg); border-radius: 12px; padding: 10px 10px; }
  .ap-item .ap-name { font-size: 14px; font-weight: 700; color: var(--ink); }
  .ap-item .ap-addr { font-size: 11px; color: var(--text-3); margin-top: 2px; }
  .ap-hint { font-size: 12px; color: var(--text-3); text-align: center; padding: 18px 8px; line-height: 1.7; }
  .addrpick-foot { display: flex; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--surface); }
  .addrpick-foot button { flex: 1; }
  /* ===== 地图版块（点位/弹窗/离线提示） ===== */
  .map-wrap { position: relative; height: 300px; border: 1px solid var(--line-strong); border-radius: 14px; overflow: hidden; background: var(--surface-2); box-shadow: 0 2px 8px var(--shadow); }
  .map-pin-wrap { background: transparent; border: none; }
  .map-pin { position: relative; width: 30px; height: 30px; background: var(--ink); color: var(--on-invert); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; box-shadow: 0 2px 6px rgba(0,0,0,0.35); border: 2px solid var(--surface); }
  .pin-dot { position: absolute; top: -3px; right: -3px; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--surface); }
  .map-offline { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 600; background: var(--surface); border: 1px solid var(--line-strong); color: var(--text-2); padding: 8px 14px; border-radius: 10px; font-size: 12px; white-space: nowrap; }
  .map-pop { font-size: 13px; }
  .map-pop-name { font-weight: 700; color: var(--ink); margin-bottom: 2px; }
  .map-pop-unit { font-size: 12px; color: var(--text-2); margin-bottom: 2px; }
  .map-pop-addr { font-size: 11px; color: var(--text-3); margin-bottom: 6px; }
  .map-pop-slots { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 4px; }
  .map-pop-tags { display: flex; gap: 4px; flex-wrap: wrap; }
  /* ===== PWA 全屏适配 ===== */
  body.standalone { background: var(--surface); padding: 0; }
  body.standalone .page-note { display: none; }
  body.standalone .phone { width: 100vw; height: 100dvh; max-width: none; border: none; border-radius: 0; min-height: 0; box-shadow: none; }
  body.standalone .phone { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  /* ===== 深色模式：马卡龙卡片夜色版 ===== */
  [data-theme="dark"] .stat-pink { background: #43305A; color: #EDF0F7; }
  [data-theme="dark"] .stat-blue { background: #2C3A63; color: #EDF0F7; }

/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {

	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {

.leaflet-grab {

	cursor:         grab;

.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {

.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {

.leaflet-container {

.leaflet-container {

	display: block;

	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {

	height: 30px;
	line-height: 30px;

.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;

.leaflet-touch .leaflet-bar a:last-child {

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {
	font-size: 22px;
	}


/* layers control */

.leaflet-control-layers {

	background: #fff;
	border-radius: 5px;
	}
.leaflet-control-layers-toggle {
	background-image: url(images/layers.png);

	height: 36px;
	}
.leaflet-retina .leaflet-control-layers-toggle {
	background-image: url(images/layers-2x.png);

	}
.leaflet-touch .leaflet-control-layers-toggle {
	width: 44px;
	height: 44px;
	}
.leaflet-control-layers .leaflet-control-layers-list,

	display: none;
	}
.leaflet-control-layers-expanded .leaflet-control-layers-list {

	}
.leaflet-control-layers-expanded {

	background: #fff;
	}
.leaflet-control-layers-scrollbar {

.leaflet-control-layers-separator {

	background-image: url(images/marker-icon.png);

/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {
	background: #fff;

.leaflet-control-attribution,

.leaflet-control-scale-line:not(:first-child) {

	}
.leaflet-control-scale-line:not(:first-child):not(:last-child) {

.leaflet-touch .leaflet-bar {
	box-shadow: none;
	}
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {

.leaflet-popup {

	text-align: center;

	padding: 6px;

.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	position: absolute;

/* Directions */

}

.leaflet-tooltip-right {

.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {

</script>
<script>
(function () {
  var STORE_KEY = 'goalplan_demo_v1';
  var today = new Date();
  function dstr(offset) {
    var d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + (offset || 0));
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function fmtDate(s) { return s.slice(5).replace('-', '/'); }

  var seed = {
    goals: [],
    tab: 'home',
    screen: 'list',
    selectMode: false,
    selected: {},
    goalId: null,
    editId: null,
    customers: [],
    tags: [],
    visits: [],
    cFilter: { kw: '', city: '', district: '', unit: '', tags: [] },
    cScreen: 'list',
    cSelId: null,
    cEditId: null,
  };
  // 中国法定节假日示例（2026年，演示数据）
  var CN_HOLIDAYS = {
    '2026-01-01': '元旦',
    '2026-02-16': '除夕',
    '2026-02-17': '春节',
    '2026-02-18': '初二',
    '2026-04-05': '清明',
    '2026-05-01': '劳动节',
    '2026-06-19': '端午',
    '2026-09-25': '中秋',
    '2026-10-01': '国庆'
  };

  var state;
  try {
    var saved = localStorage.getItem(STORE_KEY);
    state = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(seed));
    // 兼容旧版本数据：补齐客户管理相关字段
    if (!state.customers) state.customers = JSON.parse(JSON.stringify(seed.customers));
    if (!state.tags) state.tags = JSON.parse(JSON.stringify(seed.tags));
    if (!state.visits) state.visits = JSON.parse(JSON.stringify(seed.visits));
    if (!state.cFilter) state.cFilter = { kw: '', city: '', district: '', unit: '', tags: [] };
    state.customers.forEach(function (c) {
      // 旧版日期格式排班 → 每周定期（按星期归类合并）
      if (c.schedule && !c.schedule.mode) {
        var wkArr = ['mon','tue','wed','thu','fri','sat','sun'];
        var w = { mon: [], tue: [], wed: [], thu: [], fri: [], sat: [], sun: [] };
        Object.keys(c.schedule).forEach(function (ds) {
          var d = new Date(ds + 'T00:00:00');
          if (isNaN(d.getTime())) return;
          var k = wkArr[d.getDay() === 0 ? 6 : d.getDay() - 1];
          (c.schedule[ds] || []).forEach(function (sl) { if (w[k].indexOf(sl) < 0) w[k].push(sl); });
        });
        c.schedule = { mode: 'weekly', week: w };
      }
      if (c.schedule && c.schedule.mode === 'monthly' && !c.schedule.daySlots) {
        var dsM = {};
        (c.schedule.days || []).forEach(function (dd) { dsM[dd] = (c.schedule.slots || []).slice(); });
        c.schedule.daySlots = dsM;
        delete c.schedule.days; delete c.schedule.slots;
      }
      if (!c.schedule || !c.schedule.mode) c.schedule = { mode: 'weekly', week: { mon: [], tue: [], wed: [], thu: [], fri: [], sat: [], sun: [] } };
      if (state._formSchedule === undefined) state._formSchedule = null;
      if (state._schedFrom === undefined) state._schedFrom = null;
    });
    if (state.cScreen === undefined) state.cScreen = 'list';
    if (state.cSelId === undefined) state.cSelId = null;
    if (state.cEditId === undefined) state.cEditId = null;
    if (state.batchMode === undefined) state.batchMode = false;
    if (state.cSelected === undefined) state.cSelected = {};
    if (state.showFilter === undefined) state.showFilter = false;
    if (state.visits) state.visits.forEach(function (v) {
      if (v.slot && !v.slots) v.slots = [v.slot];
      if (!v.slots) v.slots = [];
      if (v.done === undefined) v.done = false;
    });
    if (state.calDays === undefined) state.calDays = 7;
    if (state.calCenter === undefined) state.calCenter = dstr(0);
    if (state.calSelected === undefined) state.calSelected = dstr(0);
    if (state.calMonthOpen === undefined) state.calMonthOpen = false;
    if (state.vScreen === undefined) state.vScreen = 'list';
    if (state._tagColor === undefined) state._tagColor = '#111111';
    if (state.theme === undefined) state.theme = 'light';
    if (['home','calendar','goals','customers','visits','map','settings'].indexOf(state.tab) < 0) state.tab = 'home';
    if (state._formLat === undefined) state._formLat = '';
    if (state._formLng === undefined) state._formLng = '';
    if (state._pickAddr === undefined) state._pickAddr = '';
    if (state._pickResult === undefined) state._pickResult = null;
    if (state.mapDate === undefined) state.mapDate = dstr(0);
    if (state.mapTags === undefined) state.mapTags = [];
    state.customers.forEach(function (c) { if (c.lat === undefined) c.lat = ''; if (c.lng === undefined) c.lng = ''; });
    if (state.calViewYear === undefined) state.calViewYear = Number(dstr(0).slice(0, 4));
    if (state.calViewMonth === undefined) state.calViewMonth = Number(dstr(0).slice(5, 7)) - 1;
  } catch (e) { state = JSON.parse(JSON.stringify(seed)); }

  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

  function sumRecords(g) { return g.records.reduce(function (s, r) { return s + r.value; }, 0); }
  function pct(g) {
    var s = sumRecords(g); var p = g.target > 0 ? s / g.target : 0;
    return Math.min(100, Math.round(p * 100));
  }
  function daysLeft(g) {
    var end = new Date(g.end + 'T23:59:59'); var t = new Date(); t.setHours(0,0,0,0);
    return Math.max(0, Math.round((end - t) / 86400000));
  }
  function autoArchive() {
    state.goals.forEach(function (g) {
      if (g.archived) return;
      var t = new Date(); t.setHours(0,0,0,0);
      var end = new Date(g.end + 'T23:59:59');
      var done = g.target > 0 && sumRecords(g) >= g.target - 1e-9;
      if (done || end < t) { g.archived = true; g.done = done; }
    });
    save();
  }
  function activeGoals() { return state.goals.filter(function (g) { return !g.archived; }); }
  function archivedGoals() { return state.goals.filter(function (g) { return g.archived; }); }
  function findGoal(id) { return state.goals.find(function (g) { return String(g.id) === String(id); }); }

  var phone = document.getElementById('phone');

  function nav(title, left, right) {
    return '<div class="nav">' +
      '<div class="nav-btn">' + (left || '') + '</div>' +
      '<div class="nav-title">' + title + '</div>' +
      '<div class="nav-btn ' + (right && right.indexOf('primary') >= 0 ? 'primary' : '') + '">' + (right || '') + '</div>' +
    '</div>';
  }

  function goalCard(g) {
    var selected = state.selected[String(g.id)];
    if (state.selectMode) {
      return '<div class="card' + (selected ? ' selected' : '') + '" data-id="' + g.id + '" onclick="APP.toggleSelect(this.dataset.id)">' +
        '<div style="display:flex;align-items:center;gap:10px;">' +
          '<div class="sel-circle' + (selected ? ' on' : '') + '"></div>' +
          '<div style="flex:1;min-width:0;">' +
            '<div class="card-head"><span class="card-name">' + g.name + '</span><span class="card-pct">' + pct(g) + '%</span></div>' +
            '<div class="card-dates">' + fmtDate(g.start) + ' ~ ' + fmtDate(g.end) + '</div>' +
            '<div class="bar"><div class="bar-fill" style="width:' + pct(g) + '%"></div></div>' +
            '<div class="card-detail">已完成 <b>' + sumRecords(g).toFixed(1) + '</b> ' + g.unit + ' · 差 ' + Math.max(0, g.target - sumRecords(g)).toFixed(1) + ' ' + g.unit + '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }
    return '<div class="card" data-id="' + g.id + '" onclick="APP.openGoal(this.dataset.id)">' +
      '<div class="card-head"><span class="card-name">' + g.name + '</span><span class="card-pct">' + pct(g) + '%</span></div>' +
      '<div class="card-dates">' + fmtDate(g.start) + ' ~ ' + fmtDate(g.end) + '</div>' +
      '<div class="bar"><div class="bar-fill" style="width:' + pct(g) + '%"></div></div>' +
      '<div class="card-detail">已完成 <b>' + sumRecords(g).toFixed(1) + '</b> ' + g.unit + ' · 差 ' + Math.max(0, g.target - sumRecords(g)).toFixed(1) + ' ' + g.unit + '</div>' +
    '</div>';
  }

  function archiveCard(g) {
    var tag = g.done ? '<span class="tag done">已完成</span>' : '<span class="tag expired">已过期</span>';
    var selected = state.selected[String(g.id)];
    if (state.selectMode) {
      return '<div class="card' + (selected ? ' selected' : '') + '" data-id="' + g.id + '" onclick="APP.toggleSelect(this.dataset.id)">' +
        '<div style="display:flex;align-items:center;gap:10px;">' +
          '<div class="sel-circle' + (selected ? ' on' : '') + '"></div>' +
          '<div style="flex:1;min-width:0;">' +
            '<div class="card-head"><span class="card-name">' + g.name + '</span>' + tag + '</div>' +
            '<div class="card-dates">' + fmtDate(g.start) + ' ~ ' + fmtDate(g.end) + '</div>' +
            '<div class="bar"><div class="bar-fill" style="width:' + pct(g) + '%"></div></div>' +
            '<div class="card-detail">完成 ' + pct(g) + '% · ' + sumRecords(g).toFixed(1) + ' / ' + g.target + ' ' + g.unit + '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }
    return '<div class="card" data-id="' + g.id + '" onclick="APP.openGoal(this.dataset.id)">' +
      '<div class="card-head"><span class="card-name">' + g.name + '</span>' + tag + '</div>' +
      '<div class="card-dates">' + fmtDate(g.start) + ' ~ ' + fmtDate(g.end) + '</div>' +
      '<div class="bar"><div class="bar-fill" style="width:' + pct(g) + '%"></div></div>' +
      '<div class="card-detail">完成 ' + pct(g) + '% · ' + sumRecords(g).toFixed(1) + ' / ' + g.target + ' ' + g.unit + '</div>' +
      '<div style="display:flex;gap:8px;margin-top:10px;" onclick="event.stopPropagation()">' +
        '<button class="btn-outline" style="padding:8px;font-size:13px;" data-id="' + g.id + '" onclick="APP.restoreGoal(this.dataset.id)">恢复</button>' +
        '<button class="btn-danger" style="padding:8px;font-size:13px;" data-id="' + g.id + '" onclick="APP.confirmDelete(this.dataset.id)">删除</button>' +
      '</div>' +
    '</div>';
  }

  function tabbar() {
    var tabs = [
      { key: 'calendar', label: '日历' },
      { key: 'goals', label: '目标计划' },
      { key: 'customers', label: '客户管理' },
      { key: 'visits', label: '拜访计划' },
      { key: 'settings', label: '设置' }
    ];
    var h = '<div class="tabbar">';
    tabs.forEach(function (t) {
      h += '<div class="tab' + (state.tab === t.key ? ' active' : '') + '" data-key="' + t.key + '" onclick="APP.switchTab(this.dataset.key)">' +
        t.label + '</div>';
    });
    return h + '</div>';
  }

  function screenList() {
    var goals = activeGoals();
    var ym = today.getFullYear() + '年' + (today.getMonth() + 1) + '月';
    var selCount = Object.keys(state.selected).length;
    var h = nav('目标计划', '', state.selectMode
      ? '<span class="primary" onclick="APP.finishSelect()">完成</span>'
      : '<span onclick="APP.enterSelect()">选择</span>');
    h += '<div class="content">';
    h += '<div class="sub">' + ym + ' · 共 ' + goals.length + ' 个目标' + (state.selectMode ? ' · 已选 ' + selCount + ' 个' : '') + '</div>';
    if (goals.length === 0) h += '<div class="empty">本月暂无进行中的目标</div>';
    goals.forEach(function (g) { h += goalCard(g); });
    if (!state.selectMode) {
      h += '<div class="btn-dashed" onclick="APP.newGoal()">＋ 添加计划</div>';

  function screenArchive() {

  function screenForm() {

                    : { name: '', start: dstr(1), end: dstr(30), unit: '', target: '' };

  function screenDetail() {
    var g = findGoal(state.goalId);
    if (!g) return screenList();
    var s = sumRecords(g), p = pct(g), dl = daysLeft(g);
    var h = nav('目标详情',
      '<span onclick="APP.back()">‹ 返回</span>',
      '<span class="primary" data-id="' + g.id + '" onclick="APP.editGoal(this.dataset.id)">编辑</span>');
    h += '<div class="content">';
    h += '<div class="card-name" style="font-size:17px;">' + g.name + '</div>';
    h += '<div class="card-dates" style="margin:4px 0 14px;">' + g.start + ' ~ ' + g.end + ' · 还剩 ' + dl + ' 天</div>';
    h += '<div class="kv">已完成 <b>' + s.toFixed(1) + '</b> / ' + g.target + ' ' + g.unit + '</div>';
    h += '<div class="big-bar"><div class="bar-fill" style="width:' + p + '%"></div></div>';
    h += '<div class="sub" style="margin-bottom:14px;">进度 ' + p + '% · ' + (g.archived ? (g.done ? '已完成' : '已过期') : '还差 ' + Math.max(0, g.target - s).toFixed(1) + ' ' + g.unit) + '</div>';
    if (!g.archived) {
      h += '<button class="btn-primary" data-id="' + g.id + '" onclick="APP.openRecord(this.dataset.id)">＋ 录入数据</button>';
    } else {
      h += '<button class="btn-outline" data-id="' + g.id + '" onclick="APP.restoreGoal(this.dataset.id)">恢复到进行中</button>';
    }
    h += '<div style="font-size:13px;font-weight:700;color:var(--text-2);margin:18px 0 4px;">录入记录</div>';
    if (g.records.length === 0) h += '<div class="empty" style="padding:20px 0;">还没有录入记录</div>';
    g.records.slice().sort(function (a, b) { return b.date < a.date ? -1 : 1; }).forEach(function (r) {
      h += '<div class="rec-row"><span>' + r.date + ' · +' + r.value + ' ' + g.unit + '</span><span class="rec-note">' + (r.note || '') + '</span></div>';
    });
    h += '</div>';
    return h;
  }

  // ========== 客户管理：辅助函数 ==========
  function findCustomer(id) { return state.customers.find(function (c) { return String(c.id) === String(id); }); }
  function findTag(id) { return state.tags.find(function (t) { return String(t.id) === String(id); }); }
  function slotName(s) { return s === 'am' ? '上午' : s === 'pm' ? '下午' : '晚上'; }
  function slotShort(s) { return s === 'am' ? 'AM' : s === 'pm' ? 'PM' : 'NIGHT'; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function dateStr(y, m, d) { return y + '-' + pad2(m + 1) + '-' + pad2(d); }
  function monthLabel(y, m) { return y + '年' + (m + 1) + '月'; }
  function holidayOf(ds) { return CN_HOLIDAYS[ds] || ''; }
  function unique(arr) { return arr.filter(function (v, i) { return arr.indexOf(v) === i; }); }
  function custTagHtml(c) {
    return c.tags.map(function (tid) {
      var t = findTag(tid);
      if (!t) return '';
      var cl = t.color || '#111111';
      return '<span class="tagchip" style="color:' + cl + ';border-color:' + cl + ';">' + t.name + '</span>';
    }).join('');
  }

  function pinyinMatch(c, k) {
    var chars = c.name.split('');
    var full = '', initials = '';
    chars.forEach(function (ch) {
      var p = SURNAME_PINYIN[ch] || '';
      if (p) { full += p; initials += p.charAt(0); }
    });
    if (full && full.indexOf(k) === 0) return true;
    if (initials && initials.indexOf(k) === 0) return true;
    var firstPy = SURNAME_PINYIN[c.name.charAt(0)] || '';
    if (firstPy && (firstPy.charAt(0) === k || firstPy.indexOf(k) === 0)) return true;
    return false;
  }
  function filteredCustomers() {
    var f = state.cFilter;

        var hay = (c.name + ' ' + c.title + ' ' + c.unit + ' ' + c.address + ' ' + (c.province || '') + ' ' + c.city + ' ' + c.district).toLowerCase();
        var matched = hay.indexOf(k) >= 0;
        if (!matched && /^[a-z]+$/.test(k)) matched = pinyinMatch(c, k);
        if (!matched) return false;
      }
      if (f.city && c.city !== f.city) return false;
      if (f.district && c.district !== f.district) return false;
      if (f.unit && c.unit !== f.unit) return false;
      if (f.tags.length && !f.tags.some(function (tid) { return c.tags.indexOf(tid) >= 0; })) return false;
      return true;
    });
  }

  var WEEK_KEYS = ['mon','tue','wed','thu','fri','sat','sun'];
  var WEEK_NAMES = { mon: '周一', tue: '周二', wed: '周三', thu: '周四', fri: '周五', sat: '周六', sun: '周日' };
  function emptyWeekly() { var w = {}; WEEK_KEYS.forEach(function (k) { w[k] = []; }); return w; }
  function emptySchedule() { return { mode: 'weekly', week: emptyWeekly() }; }
  function scheduleSummaryText(c) {
    var s = c.schedule || {};
    if (!s || !s.mode) return '暂未设置工作时间';
    if (s.mode === 'weekly') {
      var parts = [];
      WEEK_KEYS.forEach(function (k) {
        if (s.week && s.week[k] && s.week[k].length) parts.push(WEEK_NAMES[k] + ' ' + s.week[k].map(slotName).join('、'));
      });
      return parts.length ? '每周：' + parts.join('；') : '暂未设置工作时间';
    }
    if (s.mode === 'monthly') {
      var dsM = s.daySlots || {};
      var keysM = Object.keys(dsM).filter(function (k) { return dsM[k] && dsM[k].length; }).sort(function (a, b) { return Number(a) - Number(b); });
      if (!keysM.length) return '暂未设置工作时间';
      return '每月 ' + keysM.map(function (k) { return k + '号 ' + dsM[k].map(slotName).join('、'); }).join('；');
    }
    return '暂未设置工作时间';
  }
  function customerSlotsOnDate(c, ds) {
    var wps = (c.workplaces && c.workplaces.length) ? c.workplaces : [];
    var all = [];
    if (wps.length) {
      wps.forEach(function (wp) {
        scheduleSlotsOnDate(wp.schedule, ds).forEach(function (s) { if (all.indexOf(s) < 0) all.push(s); });
      });
    } else if (c.schedule) {
      all = scheduleSlotsOnDate(c.schedule, ds).slice();
    }
    return all;
  }
  function scheduleHasDate(s, ds) {
    return scheduleSlotsOnDate(s, ds).length > 0;
  }
  function scheduleSlotsOnDate(s, ds) {
    if (!s || !s.mode) return [];
    if (s.mode === 'weekly') {
      var d = new Date(ds + 'T00:00:00');
      if (isNaN(d.getTime())) return [];
      var k = WEEK_KEYS[d.getDay() === 0 ? 6 : d.getDay() - 1];
      return (s.week && s.week[k]) || [];
    }
    if (s.mode === 'monthly') {
      var day = Number(ds.slice(8, 10));
      return (s.daySlots && s.daySlots[day]) ? s.daySlots[day] : [];
    }
    return [];
  }

  function monthGridHTML(y, m) {

    h += '<div class="cal-grid">';
    for (var i = 0; i < startDow; i++) {
      var pd = prevDays - startDow + 1 + i;
      h += '<div class="cal-day other"><div class="d">' + pd + '</div></div>';
    }
    for (var d = 1; d <= daysInMonth; d++) {
      var ds = dateStr(y, m, d);
      var isToday = ds === dstr(0);
      var isSel = ds === state.calSelected;
      var holi = holidayOf(ds);
      var hasSlot = state.customers.some(function (c) { return customerSlotsOnDate(c, ds).length > 0; });
      h += '<div class="cal-day' + (isSel ? ' selected' : '') + '" data-ds="' + ds + '" onclick="APP.calPickDate(this.dataset.ds)"' + (isToday ? ' style="border:2px solid var(--line-strong);"' : '') + '>' +

  // WGS84 坐标 → 高德 GCJ02（浏览器定位返回的是 WGS84）
  function wgs84togcj02(lat, lng) {
    var PI = 3.1415926535897932384626;
    var a = 6378245.0, ee = 0.00669342162296594323;
    function outOfChina(lat2, lng2) { return (lng2 < 72.004 || lng2 > 137.8347) || (lat2 < 0.8293 || lat2 > 55.8271); }
    function transformLat(x, y) {
      var ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
      ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
      ret += (20.0 * Math.sin(y * PI) + 40.0 * Math.sin(y / 3.0 * PI)) * 2.0 / 3.0;
      ret += (160.0 * Math.sin(y / 12.0 * PI) + 320 * Math.sin(y * PI / 30.0)) * 2.0 / 3.0;
      return ret;
    }
    function transformLng(x, y) {
      var ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
      ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
      ret += (20.0 * Math.sin(x * PI) + 40.0 * Math.sin(x / 3.0 * PI)) * 2.0 / 3.0;
      ret += (150.0 * Math.sin(x / 12.0 * PI) + 300.0 * Math.sin(x / 30.0 * PI)) * 2.0 / 3.0;
      return ret;
    }
    if (outOfChina(lat, lng)) return { lat: lat, lng: lng };
    var dLat = transformLat(lng - 105.0, lat - 35.0);
    var dLng = transformLng(lng - 105.0, lat - 35.0);
    var radLat = lat / 180.0 * PI;
    var magic = Math.sin(radLat); magic = 1 - ee * magic * magic;
    var sqrtMagic = Math.sqrt(magic);
    dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * PI);
    dLng = (dLng * 180.0) / (a / sqrtMagic * Math.cos(radLat) * PI);
    return { lat: lat + dLat, lng: lng + dLng };
  }

      var trow = target ? target.closest('.tag-row') : null;

      var i = arr.indexOf(s);
      if (i >= 0) { arr.splice(i, 1); el2.classList.remove('on'); }
      else { arr.push(s); el2.classList.add('on'); }
    },
    doBatchSched: function () {
      var keys = Object.keys(state.cSelected);
      var m = state._batchMode;
      var sched;
      if (m === 'weekly') {
        var w = emptyWeekly();
        ['mon','tue','wed','thu','fri'].forEach(function (k) { w[k] = state._batchWork.slice(); });
        ['sat','sun'].forEach(function (k) { w[k] = state._batchWeekend.slice(); });
        sched = { mode: 'weekly', week: w };
      } else {
        var days = (document.getElementById('bm-days').value || '').split(/[,，\s]+/).map(function (x) { return Number(x); }).filter(function (n) { return n >= 1 && n <= 31; });
        var dsM = {};
        days.forEach(function (dd) { dsM[dd] = state._batchSlots.slice(); });
        sched = { mode: 'monthly', daySlots: dsM };
      }
      state.customers.forEach(function (c) {
        if (state.cSelected[String(c.id)]) c.schedule = JSON.parse(JSON.stringify(sched));
      });
      this.closeModal('batchsched-overlay');
      alert('已为 ' + keys.length + ' 位客户设置工作时间');
      state.batchMode = false; state.cSelected = {}; save(); render();
    },
    closeModal: function (id) {
      var o = document.getElementById(id); if (o) o.remove();
    }
  };
  window.APP = APP;

  function el(html) { var d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }

  render();
})();
</script>
<script>
  window.onerror = function () {
    var el = document.getElementById('fatal-error');
    if (!el) {
      var d = document.createElement('div');
      d.id = 'fatal-error';
      d.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:var(--surface);color:var(--text-2);display:flex;align-items:center;justify-content:center;z-index:9999;font-size:15px;padding:20px;text-align:center;';
      d.textContent = '加载失败，请刷新页面；若仍失败请清除浏览器缓存后重试';
      document.body.appendChild(d);
    }
    return false;
  };
  document.addEventListener('DOMContentLoaded', function () {
    var isStandalone = false;
    try {
      if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) isStandalone = true;
      if (navigator.standalone === true) isStandalone = true;
    } catch (e) {}
    if (isStandalone) document.body.classList.add('standalone');
  });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
</script>
</body>

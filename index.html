<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="progress">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>目标计划 · 可交互原型</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: hidden; }
  body {
    background: #EEEEEE;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    display: flex; justify-content: center; padding: 0;
  }
  .phone {
    width: 100%; max-width: 400px; background: #fff;
    height: 100vh; display: flex; flex-direction: column;
    overflow: hidden;
  }
  .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px 12px; border-bottom: 2px solid #000; background: #fff;
  }
  .nav-title { font-size: 17px; font-weight: 700; color: #000; }
  .nav-btn { font-size: 14px; color: #333; cursor: pointer; background: none; border: none; padding: 4px 0; }
  .nav-btn.primary { font-weight: 700; color: #000; }
  .nav-btn:disabled { color: #bbb; }
  .content { flex: 1; overflow-y: auto; padding: 16px 18px 20px; }
  .sub { font-size: 12px; color: #666; margin-bottom: 12px; }
  .card {
    border: 1px solid #000; border-radius: 8px; padding: 12px;
    margin-bottom: 10px; cursor: pointer; background: #fff;
    transition: background 0.12s;
  }
  .card:active { background: #F3F3F3; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; }
  .card-name { font-size: 14px; font-weight: 700; color: #000; }
  .card-pct { font-size: 14px; font-weight: 700; color: #000; }
  .card-dates { font-size: 11px; color: #888; margin: 3px 0 8px; }
  .bar { height: 6px; background: #E5E5E5; border-radius: 3px; overflow: hidden; margin-bottom: 7px; }
  .bar-fill { height: 100%; background: #000; border-radius: 3px; }
  .card-detail { font-size: 12px; color: #333; }
  .btn-dashed {
    border: 1px dashed #999; border-radius: 8px; padding: 12px;
    text-align: center; font-size: 14px; color: #333; cursor: pointer; background: #fff;
  }
  .btn-dashed:active { background: #F3F3F3; }
  .link-row { text-align: center; padding: 14px 0 0; font-size: 13px; color: #666; cursor: pointer; }
  .btn-primary {
    background: #000; color: #fff; border: none; border-radius: 8px;
    padding: 13px; text-align: center; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%;
  }
  .btn-primary:active { background: #333; }
  .btn-outline {
    background: #fff; color: #000; border: 1px solid #000; border-radius: 8px;
    padding: 13px; text-align: center; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%;
  }
  .btn-outline:active { background: #F3F3F3; }
  .btn-danger {
    background: #fff; color: #000; border: 1px solid #000; border-radius: 8px;
    padding: 10px; text-align: center; font-size: 13px; cursor: pointer; width: 100%;
  }
  .btn-danger:active { background: #F3F3F3; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: #333; margin-bottom: 5px; }
  .input {
    width: 100%; border: 1px solid #000; border-radius: 6px; padding: 10px;
    font-size: 14px; color: #000; background: #fff; font-family: inherit;
  }
  .input::placeholder { color: #bbb; }
  .input:focus { outline: none; border-width: 2px; }
  .err { color: #000; font-size: 11px; margin-top: 4px; }
  .tabbar {
    display: flex; border-top: 1px solid #000; background: #fff;
    flex-shrink: 0;
  }
  .tab {
    flex: 1; text-align: center; padding: 13px 2px 15px; font-size: 14px; font-weight: 700;
    color: #999; cursor: pointer; background: #fff; border: none;
  }
  .tab.active { color: #000; font-weight: 700; }
  .sel-circle { width: 22px; height: 22px; border: 2px solid #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: #fff; }
  .sel-circle.on { background: #000; }
  .sel-circle.on::after { content: ''; width: 8px; height: 8px; background: #fff; border-radius: 50%; }
  .card.selected { background: #F3F3F3; }
  .selbar { display: flex; align-items: center; gap: 8px; border-top: 2px solid #000; background: #fff; padding: 10px 14px; flex-shrink: 0; }
  .selbar .count { flex: 1; font-size: 13px; color: #333; text-align: center; }
  .selbar button { flex: 1; }
  .big-bar { height: 12px; background: #E5E5E5; border-radius: 6px; overflow: hidden; margin: 8px 0 6px; }
  .kv { font-size: 13px; color: #333; margin-bottom: 6px; }
  .kv b { font-size: 18px; color: #000; }
  .rec-row {
    display: flex; justify-content: space-between; padding: 9px 0;
    border-bottom: 1px solid #E5E5E5; font-size: 13px; color: #333;
  }
  .rec-note { color: #999; }
  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px; }
  .tag.done { background: #000; color: #fff; }
  .tag.expired { border: 1px solid #000; color: #000; }
  .empty { text-align: center; color: #999; font-size: 13px; padding: 40px 0; }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center; z-index: 20; padding: 20px;
  }
  .modal-box {
    background: #fff; border: 2px solid #000; border-radius: 12px;
    width: 100%; max-width: 340px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  .modal-title { font-size: 15px; font-weight: 700; color: #000; margin-bottom: 12px; text-align: center; }
  .modal-actions { display: flex; gap: 10px; margin-top: 14px; }
  .modal-actions button { flex: 1; }
  .tabpage { flex: 1; display: flex; align-items: center; justify-content: center; color: #999; font-size: 14px; flex-direction: column; }
  .tabpage .big { font-size: 40px; margin-bottom: 10px; }

  /* ===== 客户管理 ===== */
  .searchbar { display: flex; align-items: center; border: 1px solid #000; border-radius: 8px; padding: 9px 12px; margin-bottom: 10px; background: #fff; }
  .searchbar input { flex: 1; border: none; outline: none; font-size: 13px; font-family: inherit; background: transparent; color: #000; }
  .searchbar input::placeholder { color: #bbb; }
  .toolbar { display: flex; gap: 6px; margin-bottom: 12px; }
  .tool-btn { flex: 1; border: 1px solid #000; border-radius: 6px; background: #fff; color: #000; font-size: 12px; font-weight: 600; padding: 8px 0; cursor: pointer; }
  .tool-btn:active { background: #F3F3F3; }
  .tool-btn.on { background: #000; color: #fff; }
  .group-label { font-size: 12px; font-weight: 700; color: #333; margin: 14px 0 8px; padding-left: 2px; }
  .cust-row { border: 1px solid #000; border-radius: 8px; padding: 11px 12px; margin-bottom: 8px; background: #fff; cursor: pointer; display: flex; align-items: center; gap: 10px; }
  .cust-row:active { background: #F3F3F3; }
  .cust-main { flex: 1; min-width: 0; }
  .cust-name { font-size: 14px; font-weight: 700; color: #000; }
  .cust-title { font-size: 11px; color: #888; font-weight: 400; margin-left: 6px; }
  .cust-unit { font-size: 11px; color: #666; margin-top: 2px; }
  .cust-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
  .tagchip { font-size: 10px; border: 1px solid #000; border-radius: 10px; padding: 1px 8px; color: #000; background: #fff; }
  .tagchip.solid { background: #000; color: #fff; }
  .color-picker { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .color-dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff; outline: 1px solid #DDD; cursor: pointer; }
  .color-dot.on { outline: 2px solid #111; }
  .plus-btn { width: 34px; height: 34px; border: 2px solid #000; border-radius: 50%; background: #fff; color: #000; font-size: 18px; font-weight: 700; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .plus-btn:active { background: #000; color: #fff; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 3px; font-size: 10px; color: #888; text-align: center; }
  .cal-day { border: 1px solid #E5E5E5; border-radius: 6px; min-height: 44px; padding: 3px; font-size: 10px; color: #333; cursor: pointer; background: #fff; position: relative; text-align: center; }
  .cal-day.other { color: #ccc; background: #FAFAFA; }
  .cal-day.holiday { background: #F3F3F3; }
  .cal-day.selected { background: #000; color: #fff; }
  .cal-day .d { font-weight: 700; }
  .cal-day .holi { font-size: 7px; color: #000; font-weight: 600; }
  .slot-tag { display: inline-block; font-size: 8px; border-radius: 3px; padding: 0 3px; margin-top: 1px; font-weight: 700; }
  .slot-am { background: #000; color: #fff; }
  .slot-pm { background: #fff; border: 1px solid #000; color: #000; }
  .slot-night { background: #555; color: #fff; }
  .note-item { border-bottom: 1px solid #E5E5E5; padding: 9px 0; font-size: 12px; color: #333; }
  .note-item img { max-width: 100%; max-height: 140px; border: 1px solid #E5E5E5; border-radius: 6px; margin-top: 6px; display: block; }
  .note-date { font-size: 10px; color: #999; margin-bottom: 2px; }
  .filter-panel { border: 1px solid #000; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fff; }
  .filter-title { font-size: 12px; font-weight: 700; color: #000; margin-bottom: 8px; }
  .filter-group { margin-bottom: 10px; }
  .filter-group .label { font-size: 11px; color: #666; margin-bottom: 5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 11px; border: 1px solid #000; border-radius: 14px; padding: 4px 10px; color: #000; background: #fff; cursor: pointer; }
  .chip.on { background: #000; color: #fff; }
  .visit-group-date { font-size: 12px; font-weight: 700; color: #000; margin: 12px 0 6px; }
  .visit-item { display: flex; align-items: center; gap: 10px; border: 1px solid #000; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; background: #fff; }
  .slot-badge { font-size: 10px; font-weight: 700; border: 1px solid #000; border-radius: 4px; padding: 1px 6px; }
  .img-thumb { width: 46px; height: 46px; border: 1px solid #E5E5E5; border-radius: 6px; object-fit: cover; }

  .coord-tip { font-size: 11px; color: #888; margin-top: 6px; }
  /* ===== 日历版块 / 拜访完成 / 标签排序 ===== */
  .cal-strip { flex: 1; display: flex; gap: 4px; overflow-x: auto; }
  .cal-cell { flex: 1; min-width: 34px; border: 1px solid #E5E5E5; border-radius: 8px; padding: 6px 2px; text-align: center; cursor: pointer; background: #fff; }
  .cal-cell.today { border-color: #000; border-width: 2px; }
  .cal-cell.sel { background: #000; color: #fff; }
  .cal-cell .cc-week { font-size: 10px; color: #888; }
  .cal-cell .cc-day { font-size: 14px; font-weight: 700; }
  .cal-cell.sel .cc-week { color: #ccc; }
  .cal-cell .cc-holi { font-size: 7px; color: #000; }
  .cal-cell .cc-dot { font-size: 7px; color: #000; }
  .visit-item.done { opacity: 0.45; }
  .done-check { width: 22px; height: 22px; border: 1px solid #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; cursor: pointer; flex-shrink: 0; }
  .done-check.on { background: #000; color: #fff; }
  .tag-row { cursor: grab; touch-action: none; }
  .tag-row.dragging { background: #F3F3F3; opacity: 0.6; cursor: grabbing; }


  /* ===== 左侧栏布局 ===== */
  .layout { display: flex; flex: 1; min-height: 0; }
  .sidebar { width: 20%; min-width: 56px; border-right: 1px solid #E5E5E5; background: #fff; display: flex; flex-direction: column; flex-shrink: 0; }
  .side-brand { display: flex; align-items: center; justify-content: center; gap: 5px; padding: 16px 4px 12px; border-bottom: 1px solid #E5E5E5; }
  .brand-dot { width: 14px; height: 14px; background: #111; border-radius: 3px; }
  .brand-text { font-size: 13px; font-weight: 700; color: #111; letter-spacing: 0.5px; }
  .side-nav { padding: 12px 8px; display: flex; flex-direction: column; gap: 4px; }
  .side-item { padding: 11px 4px; text-align: center; cursor: pointer; font-size: 12px; color: #666; border-radius: 6px; transition: background 0.12s, transform 0.08s; }
  .side-item:hover { background: #F3F3F3; }
  .side-item:active { transform: scale(0.97); }
  .side-item.active { background: #111; color: #fff; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  @media (min-width: 768px) {
    .sidebar { width: 140px; }
    .side-brand { justify-content: flex-start; padding: 20px 18px 14px; }
    .side-nav { padding: 14px 12px; gap: 6px; }
    .side-item { font-size: 13px; text-align: left; padding: 12px 14px; }
  }
  /* ===== PWA 全屏适配 ===== */
  body.standalone { background: #fff; padding: 0; }
  body.standalone .page-note { display: none; }
  body.standalone .phone { width: 100vw; height: 100dvh; max-width: none; border: none; border-radius: 0; min-height: 0; box-shadow: none; }
  body.standalone .phone { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
</style>
</head>

<body>
<div class="phone" id="phone"></div>

<script>
(function () {
  var STORE_KEY = 'goalplan_demo_v1';
  var today = new Date();
  function dstr(offset) {
    var d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + (offset || 0));
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function fmtDate(s) { return s.slice(5).replace('-', '/'); }

  var seed = {
    goals: [],
    tab: 'goals',
    screen: 'list',
    selectMode: false,
    selected: {},
    goalId: null,
    editId: null,
    customers: [],
    tags: [],
    visits: [],
    cFilter: { kw: '', city: '', district: '', unit: '', tags: [] },
    cScreen: 'list',
    cSelId: null,
    cEditId: null,
  };
  // 中国法定节假日示例（2026年，演示数据）
  var CN_HOLIDAYS = {
    '2026-01-01': '元旦',
    '2026-02-16': '除夕',
    '2026-02-17': '春节',
    '2026-02-18': '初二',
    '2026-04-05': '清明',
    '2026-05-01': '劳动节',
    '2026-06-19': '端午',
    '2026-09-25': '中秋',
    '2026-10-01': '国庆'
  };

  var state;
  try {
    var saved = localStorage.getItem(STORE_KEY);
    state = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(seed));
    // 兼容旧版本数据：补齐客户管理相关字段
    if (!state.customers) state.customers = JSON.parse(JSON.stringify(seed.customers));
    if (!state.tags) state.tags = JSON.parse(JSON.stringify(seed.tags));
    if (!state.visits) state.visits = JSON.parse(JSON.stringify(seed.visits));
    if (!state.cFilter) state.cFilter = { kw: '', city: '', district: '', unit: '', tags: [] };
    state.customers.forEach(function (c) {
      // 旧版日期格式排班 → 每周定期（按星期归类合并）
      if (c.schedule && !c.schedule.mode) {
        var wkArr = ['mon','tue','wed','thu','fri','sat','sun'];
        var w = { mon: [], tue: [], wed: [], thu: [], fri: [], sat: [], sun: [] };
        Object.keys(c.schedule).forEach(function (ds) {
          var d = new Date(ds + 'T00:00:00');
          if (isNaN(d.getTime())) return;
          var k = wkArr[d.getDay() === 0 ? 6 : d.getDay() - 1];
          (c.schedule[ds] || []).forEach(function (sl) { if (w[k].indexOf(sl) < 0) w[k].push(sl); });
        });
        c.schedule = { mode: 'weekly', week: w };
      }
      if (c.schedule && c.schedule.mode === 'monthly' && !c.schedule.daySlots) {
        var dsM = {};
        (c.schedule.days || []).forEach(function (dd) { dsM[dd] = (c.schedule.slots || []).slice(); });
        c.schedule.daySlots = dsM;
        delete c.schedule.days; delete c.schedule.slots;
      }
      if (!c.schedule || !c.schedule.mode) c.schedule = { mode: 'weekly', week: { mon: [], tue: [], wed: [], thu: [], fri: [], sat: [], sun: [] } };
      if (state._formSchedule === undefined) state._formSchedule = null;
      if (state._schedFrom === undefined) state._schedFrom = null;
    });
    if (state.cScreen === undefined) state.cScreen = 'list';
    if (state.cSelId === undefined) state.cSelId = null;
    if (state.cEditId === undefined) state.cEditId = null;
    if (state.batchMode === undefined) state.batchMode = false;
    if (state.cSelected === undefined) state.cSelected = {};
    if (state.showFilter === undefined) state.showFilter = false;
    if (state.visits) state.visits.forEach(function (v) {
      if (v.slot && !v.slots) v.slots = [v.slot];
      if (!v.slots) v.slots = [];
      if (v.done === undefined) v.done = false;
    });
    if (state.calDays === undefined) state.calDays = 7;
    if (state.calCenter === undefined) state.calCenter = dstr(0);
    if (state.calSelected === undefined) state.calSelected = dstr(0);
    if (state.calMonthOpen === undefined) state.calMonthOpen = false;
    if (state.vScreen === undefined) state.vScreen = 'list';
    if (state._tagColor === undefined) state._tagColor = '#111111';
    if (state.calViewYear === undefined) state.calViewYear = Number(dstr(0).slice(0, 4));
    if (state.calViewMonth === undefined) state.calViewMonth = Number(dstr(0).slice(5, 7)) - 1;
  } catch (e) { state = JSON.parse(JSON.stringify(seed)); }

  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

  function sumRecords(g) { return g.records.reduce(function (s, r) { return s + r.value; }, 0); }
  function pct(g) {
    var s = sumRecords(g); var p = g.target > 0 ? s / g.target : 0;
    return Math.min(100, Math.round(p * 100));
  }
  function daysLeft(g) {
    var end = new Date(g.end + 'T23:59:59'); var t = new Date(); t.setHours(0,0,0,0);
    return Math.max(0, Math.round((end - t) / 86400000));
  }
  function autoArchive() {
    state.goals.forEach(function (g) {
      if (g.archived) return;
      var t = new Date(); t.setHours(0,0,0,0);
      var end = new Date(g.end + 'T23:59:59');
      var done = g.target > 0 && sumRecords(g) >= g.target - 1e-9;
      if (done || end < t) { g.archived = true; g.done = done; }
    });
    save();
  }
  function activeGoals() { return state.goals.filter(function (g) { return !g.archived; }); }
  function archivedGoals() { return state.goals.filter(function (g) { return g.archived; }); }
  function findGoal(id) { return state.goals.find(function (g) { return String(g.id) === String(id); }); }

  var phone = document.getElementById('phone');

  function nav(title, left, right) {
    return '<div class="nav">' +
      '<div class="nav-btn">' + (left || '') + '</div>' +
      '<div class="nav-title">' + title + '</div>' +
      '<div class="nav-btn ' + (right && right.indexOf('primary') >= 0 ? 'primary' : '') + '">' + (right || '') + '</div>' +
    '</div>';
  }

  function goalCard(g) {
    var selected = state.selected[String(g.id)];
    if (state.selectMode) {
      return '<div class="card' + (selected ? ' selected' : '') + '" data-id="' + g.id + '" onclick="APP.toggleSelect(this.dataset.id)">' +
        '<div style="display:flex;align-items:center;gap:10px;">' +
          '<div class="sel-circle' + (selected ? ' on' : '') + '"></div>' +
          '<div style="flex:1;min-width:0;">' +
            '<div class="card-head"><span class="card-name">' + g.name + '</span><span class="card-pct">' + pct(g) + '%</span></div>' +
            '<div class="card-dates">' + fmtDate(g.start) + ' ~ ' + fmtDate(g.end) + '</div>' +
            '<div class="bar"><div class="bar-fill" style="width:' + pct(g) + '%"></div></div>' +
            '<div class="card-detail">已完成 <b>' + sumRecords(g).toFixed(1) + '</b> ' + g.unit + ' · 差 ' + Math.max(0, g.target - sumRecords(g)).toFixed(1) + ' ' + g.unit + '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }
    return '<div class="card" data-id="' + g.id + '" onclick="APP.openGoal(this.dataset.id)">' +
      '<div class="card-head"><span class="card-name">' + g.name + '</span><span class="card-pct">' + pct(g) + '%</span></div>' +
      '<div class="card-dates">' + fmtDate(g.start) + ' ~ ' + fmtDate(g.end) + '</div>' +
      '<div class="bar"><div class="bar-fill" style="width:' + pct(g) + '%"></div></div>' +
      '<div class="card-detail">已完成 <b>' + sumRecords(g).toFixed(1) + '</b> ' + g.unit + ' · 差 ' + Math.max(0, g.target - sumRecords(g)).toFixed(1) + ' ' + g.unit + '</div>' +
    '</div>';
  }

  function archiveCard(g) {
    var tag = g.done ? '<span class="tag done">已完成</span>' : '<span class="tag expired">已过期</span>';
    var selected = state.selected[String(g.id)];
    if (state.selectMode) {

  function tabbar() {
    var tabs = [
      { key: 'calendar', label: '日历' },
      { key: 'goals', label: '目标计划' },
      { key: 'customers', label: '客户管理' },
      { key: 'visits', label: '拜访计划' },
      { key: 'settings', label: '设置' }
    ];
    var h = '<div class="tabbar">';
    tabs.forEach(function (t) {
      h += '<div class="tab' + (state.tab === t.key ? ' active' : '') + '" data-key="' + t.key + '" onclick="APP.switchTab(this.dataset.key)">' +
        t.label + '</div>';

  function screenList() {
    var goals = activeGoals();
    var ym = today.getFullYear() + '年' + (today.getMonth() + 1) + '月';
    var selCount = Object.keys(state.selected).length;
    var h = nav('目标计划', '', state.selectMode
      ? '<span class="primary" onclick="APP.finishSelect()">完成</span>'
      : '<span onclick="APP.enterSelect()">选择</span>');
    h += '<div class="content">';
    h += '<div class="sub">' + ym + ' · 共 ' + goals.length + ' 个目标' + (state.selectMode ? ' · 已选 ' + selCount + ' 个' : '') + '</div>';
    if (goals.length === 0) h += '<div class="empty">本月暂无进行中的目标</div>';
    goals.forEach(function (g) { h += goalCard(g); });
    if (!state.selectMode) {
      h += '<div class="btn-dashed" onclick="APP.newGoal()">＋ 添加计划</div>';
      h += '<div class="link-row" onclick="APP.openArchive()">📁 已归档目标（' + archivedGoals().length + '）</div>';
    }
    h += '</div>';
    if (state.selectMode) {
      var allSelected = goals.length > 0 && goals.every(function (g) { return state.selected[String(g.id)]; });
      h += '<div class="selbar">' +
        '<button class="btn-outline" style="padding:8px;font-size:13px;" onclick="APP.batchArchive()">归档</button>' +
        '<button class="btn-outline" style="padding:8px;font-size:13px;" onclick="APP.selectAll()">' + (allSelected ? '取消全选' : '全选') + '</button>' +
        '<button class="btn-danger" style="padding:8px;font-size:13px;" onclick="APP.batchDelete()">删除</button>' +
      '</div>';
    }
    return h;
  }

  function screenArchive() {
    var list = archivedGoals();
    var h = nav('已归档',
      '<span onclick="APP.back()">‹ 返回</span>',
      state.selectMode
        ? '<span class="primary" onclick="APP.finishSelect()">完成</span>'

  function screenForm() {
    var editing = state.editId ? findGoal(state.editId) : null;
    var f = editing ? { name: editing.name, start: editing.start, end: editing.end, unit: editing.unit, target: editing.target }
                    : { name: '', start: dstr(1), end: dstr(30), unit: '', target: '' };
    var h = nav(editing ? '编辑目标' : '新建目标',

    h += '<div class="content">' +
      '<div class="field"><label>目标名称</label><input class="input" id="f-name" value="' + f.name + '" placeholder="如：8月销售目标"></div>' +

  function screenDetail() {
    var g = findGoal(state.goalId);
    if (!g) return screenList();
    var s = sumRecords(g), p = pct(g), dl = daysLeft(g);
    var h = nav('目标详情',
      '<span onclick="APP.back()">‹ 返回</span>',
      '<span class="primary" data-id="' + g.id + '" onclick="APP.editGoal(this.dataset.id)">编辑</span>');
    h += '<div class="content">';
    h += '<div class="card-name" style="font-size:17px;">' + g.name + '</div>';
    h += '<div class="card-dates" style="margin:4px 0 14px;">' + g.start + ' ~ ' + g.end + ' · 还剩 ' + dl + ' 天</div>';
    h += '<div class="kv">已完成 <b>' + s.toFixed(1) + '</b> / ' + g.target + ' ' + g.unit + '</div>';
    h += '<div class="big-bar"><div class="bar-fill" style="width:' + p + '%"></div></div>';
    h += '<div class="sub" style="margin-bottom:14px;">进度 ' + p + '% · ' + (g.archived ? (g.done ? '已完成' : '已过期') : '还差 ' + Math.max(0, g.target - s).toFixed(1) + ' ' + g.unit) + '</div>';
    if (!g.archived) {
      h += '<button class="btn-primary" data-id="' + g.id + '" onclick="APP.openRecord(this.dataset.id)">＋ 录入数据</button>';
    } else {
      h += '<button class="btn-outline" data-id="' + g.id + '" onclick="APP.restoreGoal(this.dataset.id)">恢复到进行中</button>';
    }
    h += '<div style="font-size:13px;font-weight:700;color:#333;margin:18px 0 4px;">录入记录</div>';
    if (g.records.length === 0) h += '<div class="empty" style="padding:20px 0;">还没有录入记录</div>';
    g.records.slice().sort(function (a, b) { return b.date < a.date ? -1 : 1; }).forEach(function (r) {
      h += '<div class="rec-row"><span>' + r.date + ' · +' + r.value + ' ' + g.unit + '</span><span class="rec-note">' + (r.note || '') + '</span></div>';
    });
    h += '</div>';
    return h;
  }

  function findCustomer(id) { return state.customers.find(function (c) { return String(c.id) === String(id); }); }
  function findTag(id) { return state.tags.find(function (t) { return String(t.id) === String(id); }); }
  function slotName(s) { return s === 'am' ? '上午' : s === 'pm' ? '下午' : '晚上'; }
  function slotShort(s) { return s === 'am' ? 'AM' : s === 'pm' ? 'PM' : 'NIGHT'; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function dateStr(y, m, d) { return y + '-' + pad2(m + 1) + '-' + pad2(d); }
  function monthLabel(y, m) { return y + '年' + (m + 1) + '月'; }
  function holidayOf(ds) { return CN_HOLIDAYS[ds] || ''; }
  function unique(arr) { return arr.filter(function (v, i) { return arr.indexOf(v) === i; }); }
  function custTagHtml(c) {
    return c.tags.map(function (tid) {
      var t = findTag(tid);
      if (!t) return '';
      var cl = t.color || '#111111';
      return '<span class="tagchip" style="color:' + cl + ';border-color:' + cl + ';">' + t.name + '</span>';
    }).join('');
  }

  function pinyinMatch(c, k) {
    var chars = c.name.split('');
    var full = '', initials = '';
    chars.forEach(function (ch) {
      var p = SURNAME_PINYIN[ch] || '';
      if (p) { full += p; initials += p.charAt(0); }
    });
    if (full && full.indexOf(k) === 0) return true;
    if (initials && initials.indexOf(k) === 0) return true;
    var firstPy = SURNAME_PINYIN[c.name.charAt(0)] || '';
    if (firstPy && (firstPy.charAt(0) === k || firstPy.indexOf(k) === 0)) return true;
    return false;
  }
  function filteredCustomers() {
    var f = state.cFilter;
    return state.customers.filter(function (c) {
      if (f.kw) {
        var k = f.kw.toLowerCase();
        var hay = (c.name + ' ' + c.title + ' ' + c.unit + ' ' + c.address + ' ' + (c.province || '') + ' ' + c.city + ' ' + c.district).toLowerCase();
        var matched = hay.indexOf(k) >= 0;
        if (!matched && /^[a-z]+$/.test(k)) matched = pinyinMatch(c, k);
        if (!matched) return false;
      }
      if (f.city && c.city !== f.city) return false;
      if (f.district && c.district !== f.district) return false;
      if (f.unit && c.unit !== f.unit) return false;
      if (f.tags.length && !f.tags.some(function (tid) { return c.tags.indexOf(tid) >= 0; })) return false;
      return true;
    });
  }

  var WEEK_KEYS = ['mon','tue','wed','thu','fri','sat','sun'];
  var WEEK_NAMES = { mon: '周一', tue: '周二', wed: '周三', thu: '周四', fri: '周五', sat: '周六', sun: '周日' };
  function emptyWeekly() { var w = {}; WEEK_KEYS.forEach(function (k) { w[k] = []; }); return w; }
  function emptySchedule() { return { mode: 'weekly', week: emptyWeekly() }; }
  function scheduleSummaryText(c) {
    var s = c.schedule || {};
    if (!s || !s.mode) return '暂未设置工作时间';
    if (s.mode === 'weekly') {
      var parts = [];
      WEEK_KEYS.forEach(function (k) {
        if (s.week && s.week[k] && s.week[k].length) parts.push(WEEK_NAMES[k] + ' ' + s.week[k].map(slotName).join('、'));
      });
      return parts.length ? '每周：' + parts.join('；') : '暂未设置工作时间';
    }
    if (s.mode === 'monthly') {
      var dsM = s.daySlots || {};
      var keysM = Object.keys(dsM).filter(function (k) { return dsM[k] && dsM[k].length; }).sort(function (a, b) { return Number(a) - Number(b); });
      if (!keysM.length) return '暂未设置工作时间';
      return '每月 ' + keysM.map(function (k) { return k + '号 ' + dsM[k].map(slotName).join('、'); }).join('；');
    }
    return '暂未设置工作时间';
  }
  function scheduleHasDate(s, ds) {
    return scheduleSlotsOnDate(s, ds).length > 0;
  }
  function scheduleSlotsOnDate(s, ds) {
    if (!s || !s.mode) return [];
    if (s.mode === 'weekly') {
      var d = new Date(ds + 'T00:00:00');
      if (isNaN(d.getTime())) return [];
      var k = WEEK_KEYS[d.getDay() === 0 ? 6 : d.getDay() - 1];
      return (s.week && s.week[k]) || [];
    }
    if (s.mode === 'monthly') {
      var day = Number(ds.slice(8, 10));
      return (s.daySlots && s.daySlots[day]) ? s.daySlots[day] : [];
    }
    return [];
  }

    return '<div style="font-size:12px;color:#333;padding:4px 0 10px;">' + scheduleSummaryText(c) + '</div>';
  }

    }
    for (var d = 1; d <= daysInMonth; d++) {

  var APP = {
    switchTab: function (k) {
      state.tab = k; state.screen = 'list'; state.goalId = null;
      state.selectMode = false; state.selected = {};
      state.cScreen = 'list'; state.cSelId = null; state.cEditId = null;
      state.batchMode = false; state.cSelected = {}; state.showFilter = false;
      state.vScreen = 'list';
      state._formTags = [];
      save(); render();
    },
    exportData: function () {
      var payload = {
        version: 1,
        exportedAt: dstr(0),
        goals: JSON.parse(JSON.stringify(state.goals)),
        customers: JSON.parse(JSON.stringify(state.customers)),
        tags: JSON.parse(JSON.stringify(state.tags)),
        visits: JSON.parse(JSON.stringify(state.visits))
      };
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = '工作台备份-' + dstr(0) + '.json';
      document.body.appendChild(a);

          clearTimeout(d.timer);
          APP.tagUp();
        }
        return;
      }
      var target = document.elementFromPoint(ev.clientX, ev.clientY);
      var trow = target ? target.closest('.tag-row') : null;
      if (!trow) return;
      var dragRow = document.querySelector('.tag-row[data-id="' + d.id + '"]');

      var si = state.tags.findIndex(function (t) { return String(t.id) === String(d.id); });

      var tmp = state.tags[si]; state.tags[si] = state.tags[ti]; state.tags[ti] = tmp;
      var parent = dragRow.parentNode;

      if (!keys.length) { alert('请先选择客户'); return; }
      state._batchMode = 'weekly'; state._batchWork = []; state._batchWeekend = []; state._batchDays = []; state._batchSlots = [];
      var box = el('<div class="modal-overlay" id="batchsched-overlay"><div class="modal-box">' +
        '<div class="modal-title">批量设置工作时间（' + keys.length + ' 位客户）</div>' +
        '<div class="field"><label>循环模式</label><div class="chips" style="justify-content:center;">' +
          '<span class="chip on" id="bm-weekly" onclick="APP.batchMode(this,\'weekly\')">每周定期</span>' +
          '<span class="chip" id="bm-monthly" onclick="APP.batchMode(this,\'monthly\')">每月N天</span>' +
        '</div></div>' +
        '<div id="bm-weekly-box">' +
          '<div class="field"><label>工作日（周一~周五）班次</label><div class="chips" style="justify-content:center;">' +
            '<span class="chip" data-s="am" onclick="APP.batchSlot(this,\'work\')">上午</span>' +
            '<span class="chip" data-s="pm" onclick="APP.batchSlot(this,\'work\')">下午</span>' +
            '<span class="chip" data-s="night" onclick="APP.batchSlot(this,\'work\')">晚上</span>' +
          '</div></div>' +
          '<div class="field"><label>周末（周六~周日）班次</label><div class="chips" style="justify-content:center;">' +
            '<span class="chip" data-s="am" onclick="APP.batchSlot(this,\'weekend\')">上午</span>' +
            '<span class="chip" data-s="pm" onclick="APP.batchSlot(this,\'weekend\')">下午</span>' +
            '<span class="chip" data-s="night" onclick="APP.batchSlot(this,\'weekend\')">晚上</span>' +
          '</div></div>' +
        '</div>' +
        '<div id="bm-monthly-box" style="display:none;">' +
          '<div class="field"><label>每月几号（逗号分隔，如 5,15,25）</label><input class="input" id="bm-days" placeholder="如：5,15,25"></div>' +
          '<div class="field"><label>班次</label><div class="chips" style="justify-content:center;">' +
            '<span class="chip" data-s="am" onclick="APP.batchSlot(this,\'slots\')">上午</span>' +
            '<span class="chip" data-s="pm" onclick="APP.batchSlot(this,\'slots\')">下午</span>' +
            '<span class="chip" data-s="night" onclick="APP.batchSlot(this,\'slots\')">晚上</span>' +
          '</div></div>' +
        '</div>' +
        '<div class="modal-actions"><button class="btn-outline" onclick="APP.closeModal(\'batchsched-overlay\')">取消</button>' +
        '<button class="btn-primary" onclick="APP.doBatchSched()">确定</button></div></div></div>');
      document.body.appendChild(box);
    },
    batchMode: function (el2, m) {
      state._batchMode = m;
      var w = document.getElementById('bm-weekly'), mo = document.getElementById('bm-monthly');
      if (w) w.classList.toggle('on', m === 'weekly');
      if (mo) mo.classList.toggle('on', m === 'monthly');
      var wb = document.getElementById('bm-weekly-box'), mb = document.getElementById('bm-monthly-box');
      if (wb) wb.style.display = m === 'weekly' ? '' : 'none';
      if (mb) mb.style.display = m === 'monthly' ? '' : 'none';
    },
    batchSlot: function (el2, group) {
      var s = el2.dataset.s;
      var key = group === 'work' ? '_batchWork' : group === 'weekend' ? '_batchWeekend' : '_batchSlots';
      var arr = state[key];
      var i = arr.indexOf(s);
      if (i >= 0) { arr.splice(i, 1); el2.classList.remove('on'); }
      else { arr.push(s); el2.classList.add('on'); }
    },
    doBatchSched: function () {
      var keys = Object.keys(state.cSelected);
      var m = state._batchMode;
      var sched;
      if (m === 'weekly') {
        var w = emptyWeekly();
        ['mon','tue','wed','thu','fri'].forEach(function (k) { w[k] = state._batchWork.slice(); });
        ['sat','sun'].forEach(function (k) { w[k] = state._batchWeekend.slice(); });
        sched = { mode: 'weekly', week: w };
      } else {
        var days = (document.getElementById('bm-days').value || '').split(/[,，\s]+/).map(function (x) { return Number(x); }).filter(function (n) { return n >= 1 && n <= 31; });
        var dsM = {};
        days.forEach(function (dd) { dsM[dd] = state._batchSlots.slice(); });
        sched = { mode: 'monthly', daySlots: dsM };
      }
      state.customers.forEach(function (c) {
        if (state.cSelected[String(c.id)]) c.schedule = JSON.parse(JSON.stringify(sched));
      });
      this.closeModal('batchsched-overlay');
      alert('已为 ' + keys.length + ' 位客户设置工作时间');
      state.batchMode = false; state.cSelected = {}; save(); render();
    },
    closeModal: function (id) {
      var o = document.getElementById(id); if (o) o.remove();
    }
  };
  window.APP = APP;

  function el(html) { var d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }

  render();
})();
</script>
<script>
  window.onerror = function () {
    var el = document.getElementById('fatal-error');
    if (!el) {
      var d = document.createElement('div');
      d.id = 'fatal-error';
      d.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;color:#333;display:flex;align-items:center;justify-content:center;z-index:9999;font-size:15px;padding:20px;text-align:center;';
      d.textContent = '加载失败，请刷新页面；若仍失败请清除浏览器缓存后重试';
      document.body.appendChild(d);
    }
    return false;
  };
  document.addEventListener('DOMContentLoaded', function () {
    var isStandalone = false;
    try {
      if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) isStandalone = true;
      if (navigator.standalone === true) isStandalone = true;
    } catch (e) {}
    if (isStandalone) document.body.classList.add('standalone');
  });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
